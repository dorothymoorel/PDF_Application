[project]
name = "transloka-workspace"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "transloka-api",
  "transloka-core",
  "transloka-document-ir",
  "transloka-documents",
  "transloka-glossary",
  "transloka-quality",
  "transloka-reconstruction",
  "transloka-translation",
  "transloka-worker",
]
classifiers = ["Private :: Do Not Upload"]

[tool.uv]
package = false

[tool.uv.sources]
transloka-api = { workspace = true }
transloka-core = { workspace = true }
transloka-document-ir = { workspace = true }
transloka-documents = { workspace = true }
transloka-glossary = { workspace = true }
transloka-quality = { workspace = true }
transloka-reconstruction = { workspace = true }
transloka-translation = { workspace = true }
transloka-worker = { workspace = true }

[tool.uv.workspace]
members = [
  "python/*",
  "services/api",
  "services/worker",
]

[dependency-groups]
dev = [
    "httpx2>=2.9.1",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.ruff]
extend-exclude = ["docs"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.format]
indent-style = "space"
line-ending = "lf"
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
exclude = [
  "(^|/)(\\.venv|node_modules|\\.mypy_cache|\\.ruff_cache)/",
]
