[project]
name = "transloka-workspace"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "transloka-api",
  "transloka-core",
  "transloka-document-ir",
  "transloka-documents",
  "transloka-glossary",
  "transloka-quality",
  "transloka-reconstruction",
  "transloka-translation",
  "transloka-worker",
]
classifiers = ["Private :: Do Not Upload"]

[project.optional-dependencies]
ct2 = [
  "ctranslate2==4.6.0",
  "sentencepiece==0.2.1",
]

[tool.uv]
package = false

[tool.uv.sources]
transloka-api = { workspace = true }
transloka-core = { workspace = true }
transloka-document-ir = { workspace = true }
transloka-documents = { workspace = true }
transloka-glossary = { workspace = true }
transloka-quality = { workspace = true }
transloka-reconstruction = { workspace = true }
transloka-translation = { workspace = true }
transloka-worker = { workspace = true }
paddlepaddle = { index = "paddlepaddle" }
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "paddlepaddle"
url = "https://www.paddlepaddle.org.cn/packages/stable/cpu/"
explicit = true

[tool.uv.workspace]
members = [
  "python/*",
  "services/api",
  "services/worker",
]

[dependency-groups]
ct2-convert = [
    "ctranslate2==4.6.0",
    "sentencepiece==0.2.1",
    "torch==2.8.0",
    "transformers==4.56.2",
]
dev = [
    "httpx2>=2.9.1",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.ruff]
extend-exclude = ["docs"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.format]
indent-style = "space"
line-ending = "lf"
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
exclude = [
  "(^|/)(\\.venv|node_modules|\\.mypy_cache|\\.ruff_cache)/",
]
