[project]
name = "transloka-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.140.0",
    "pydantic-settings>=2.14.2",
    "uvicorn>=0.51.0",
]
classifiers = ["Private :: Do Not Upload"]

[project.scripts]
transloka-api = "transloka_api.main:run"

[build-system]
requires = ["uv_build>=0.11.26,<0.12"]
build-backend = "uv_build"
