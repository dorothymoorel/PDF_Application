[project]
name = "transloka-documents"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pdfplumber>=0.11.10,<0.12",
    "pypdf[crypto]>=6.14,<7",
    "pypdfium2>=5.12.1,<6",
]
classifiers = ["Private :: Do Not Upload"]

[build-system]
requires = ["uv_build>=0.11.26,<0.12"]
build-backend = "uv_build"
