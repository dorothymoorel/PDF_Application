[project]
name = "transloka-core"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13,<2.0",
    "sqlalchemy>=2.0,<3.0",
]
classifiers = ["Private :: Do Not Upload"]

[project.scripts]
transloka = "transloka_core.cli.main:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12"]
build-backend = "uv_build"
